<!DOCTYPE html>
<html>
<head>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

header{
background:#333;
color:white;
padding:15px;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
}

.menu{
display:flex;
gap:20px;
}

.menu a{
color:white;
text-decoration:none;
}

#check{
display:none;
}

.hamburger{
display:none;
font-size:25px;
cursor:pointer;
}

@media(max-width:768px){

.menu{
display:none;
flex-direction:column;
background:#444;
position:absolute;
top:60px;
left:0;
width:100%;
padding:10px;
}

#check:checked ~ .menu{
display:flex;
}

.hamburger{
display:block;
}
}
</style>
</head>
<body>

<header>
<nav>

<h2>Logo</h2>

<input type="checkbox" id="check">

<label for="check" class="hamburger">
☰
</label>

<div class="menu">
<a href="#">Home</a>
<a href="#">About</a>
<a href="#">Services</a>
<a href="#">Contact</a>
</div>

</nav>
</header>

</body>
</html>
